<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول - Web3 Exchange</title>

    <!-- ربط الـ Manifest والأيقونات بروابط مباشرة صريحة -->
    <link rel="manifest" href="https://mhamednagem2023-eng.github.io/Trada2004/manifest.json">
    <link rel="icon" type="image/png" sizes="512x512" href="https://mhamednagem2023-eng.github.io/Trada2004/logo.png">
    <link rel="shortcut icon" href="https://mhamednagem2023-eng.github.io/Trada2004/logo.png">
    <link rel="apple-touch-icon" sizes="512x512" href="https://mhamednagem2023-eng.github.io/Trada2004/logo.png">
    <meta name="msapplication-TileImage" content="https://mhamednagem2023-eng.github.io/Trada2004/logo.png">
    <meta property="og:image" content="https://mhamednagem2023-eng.github.io/Trada2004/logo.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #181a20;
            --accent-color: #f0b90b;
            --text-color: #eaecef;
            --border-color: #2b313a;
            --green-color: #0ecb81;
            --red-color: #f6465d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .logo-container h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--accent-color);
        }

        .btn-connect {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .btn-connect:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 12px;
            padding: 12px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-section {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 500px;
        }

        .tradingview-widget-container {
            height: 100%;
            width: 100%;
        }

        .trading-panel {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .trading-panel h3 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #848e9c;
        }

        .input-group input {
            background-color: #2b313a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            font-size: 1rem;
        }

        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-buy {
            background-color: var(--green-color);
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-sell {
            background-color: var(--red-color);
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-buy:hover, .btn-sell:hover {
            opacity: 0.9;
        }

        .wallet-info {
            background-color: #2b313a;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://mhamednagem2023-eng.github.io/Trada2004/logo.png" alt="Logo">
            <h1>منصة التداول الرقمية</h1>
        </div>
        <button id="connectWalletBtn" class="btn-connect" onclick="connectWallet()">ربط محفظة Web3</button>
    </header>

    <div class="main-container">
        
        <div class="chart-section">
            <div class="tradingview-widget-container">
                <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "BINANCE:BTCUSDT",
                    "interval": "D",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "ar",
                    "toolbar_bg": "#f1f3f6",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_chart"
                });
                </script>
            </div>
        </div>

        <div class="trading-panel">
            <h3>تنفيذ الأوامر</h3>
            
            <div id="walletDetails" class="wallet-info">
                <span>المحفظة المتصلة:</span><br>
                <strong id="walletAddress"></strong>
            </div>

            <div class="input-group">
                <label>السعر (USDT)</label>
                <input type="number" placeholder="السعر السوقي المباشر" readonly>
            </div>

            <div class="input-group">
                <label>الكمية (BTC)</label>
                <input type="number" id="amountInput" placeholder="0.00">
            </div>

            <div class="trade-buttons">
                <button class="btn-buy" onclick="executeTrade('buy')">شراء (Buy)</button>
                <button class="btn-sell" onclick="executeTrade('sell')">بيع (Sell)</button>
            </div>
        </div>

    </div>

    <script>
        let userAddress = null;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    const signer = provider.getSigner();
                    userAddress = await signer.getAddress();

                    document.getElementById('connectWalletBtn').innerText = "تم الربط";
                    document.getElementById('connectWalletBtn').style.backgroundColor = "#0ecb81";
                    document.getElementById('walletDetails').style.display = "block";
                    document.getElementById('walletAddress').innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    
                    alert("تم ربط المحفظة بنجاح!\nالعنوان: " + userAddress);
                } catch (error) {
                    console.error(error);
                    alert("حدث خطأ أثناء الاتصال بالمحفظة.");
                }
            } else {
                alert("لم يتم العثور على محفظة Web3! يرجى فتح الموقع عبر متصفح محفظة مثل TokenPocket أو MetaMask.");
            }
        }

        function executeTrade(type) {
            if (!userAddress) {
                alert("يرجى ربط المحفظة أولاً قبل تنفيذ الصفقة.");
                return;
            }
            const amount = document.getElementById('amountInput').value;
            if (!amount || amount <= 0) {
                alert("يرجى إدخال كمية صالحة للتداول.");
                return;
            }
            alert(`جاري طلب أمر ${type === 'buy' ? 'الشراء' : 'البيع'} للكمية: ${amount} BTC`);
        }
    </script>

</body>
</html>
